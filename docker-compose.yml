services:
  proxy:
    image: nginx:1.27-alpine
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - red_interna
    restart: unless-stopped

  app:
    build: ./app
    image: gabdome/app-login:1.0.0
    container_name: app
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - red_interna
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: db
    env_file: .env
    volumes:
      - datos_pg:/var/lib/postgresql/data
      - ./app/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - red_interna
    restart: unless-stopped

networks:
  red_interna:
    driver: bridge
    ipam:
      config:
        - subnet: 10.77.0.0/24

volumes:
  datos_pg: